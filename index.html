<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Presentación</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    min-height:100vh;
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    padding:30px;
}

h1{
    text-align:center;
    color:white;
    margin-bottom:30px;
    text-shadow:2px 2px 5px rgba(0,0,0,0.3);
}

.contenedor-superior{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
}

.caja{
    width:350px;
    border-radius:15px;
    padding:20px;
    box-shadow:0 4px 15px rgba(0,0,0,0.2);
}

.datos{
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
}

.datos h2{
    margin-bottom:15px;
}

.datos p{
    margin:10px 0;
    font-size:18px;
}

.foto{
    background:linear-gradient(135deg,#a18cd1,#fbc2eb);
    text-align:center;
}

.foto img{
    width:220px;
    height:220px;
    border-radius:10px;
    object-fit:cover;
    border:4px solid white;
}

.pasantias{
    width:500px;
    margin:50px auto;
    text-align:center;
    background:white;
    border-radius:15px;
    padding:25px;
    box-shadow:0 4px 15px rgba(0,0,0,0.2);
}

.pasantias h2{
    margin-bottom:15px;
}

.texto-degrade{
    font-size:24px;
    font-weight:bold;
    background:linear-gradient(90deg,#ff512f,#dd2476,#1fa2ff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}
</style>

</head>
<body>

<h1> MUÑOZ CAMPUZANO KATHERIN LISSETTE</h1>

<div class="contenedor-superior">

    <div class="caja datos">
        <h2>Datos Personales</h2>
        <p><strong>Nombre:</strong> Tu Nombre</p>
        <p><strong>Curso:</strong> 3ro Bachillerato</p>
        <p><strong>Especialidad:</strong> Informática</p>
        <p><strong>Colegio:</strong> Nombre del Colegio</p>
    </div>

    <div class="caja foto">
        <img src="Kathy.jpg" alt="">
    </div>

</div>

<div class="pasantias">
    <h2>Pasantías</h2>
    <p class="texto-degrade">
        Realizaré mis pasantías en la empresa ABC Tecnología.
    </p>
</div>

</body>
</html>
